<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Study Buddy AI</title>
<style>
  :root {
    --bg: #1D2130; --panel: #172338; --panel-border: #2B3A52;
    --deep: #0B1220; --accent: #6D5AE6; --accent-hover: #8170F0;
    --text: #E2E8F0; --muted: #94A3B8; --faint: #64748B;
    --error-bg: #2A1414; --error-text: #FCA5A5;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 22px; border-bottom: 1px solid var(--panel-border);
  }
  header h1 { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 9px; }
  header h1 img { width: 32px; height: 32px; border-radius: 9px; }
  header .sub { font-size: 11px; color: var(--faint); }
  header button {
    margin-left: auto; background: var(--deep); color: #CBD5E1;
    border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 8px 14px; font-size: 12px; cursor: pointer;
  }
  header button:hover { border-color: var(--accent); color: #fff; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px;
    font-size: 14px; line-height: 1.55; overflow-wrap: break-word;
  }
  .bubble.user { background: var(--accent); color: #fff; }
  .bubble.bot {
    background: var(--panel); border: 1px solid var(--panel-border);
  }
  .bubble.bot.error { background: var(--error-bg); color: var(--error-text); border-color: #7F1D1D; }
  .bubble.bot h1, .bubble.bot h2, .bubble.bot h3 { margin: 8px 0 4px; }
  .bubble.bot p { margin: 6px 0; }
  .bubble.bot ul, .bubble.bot ol { margin: 6px 0 6px 20px; }
  .bubble.bot pre {
    background: var(--deep); padding: 10px; border-radius: 8px;
    overflow-x: auto; margin: 8px 0; font-size: 13px;
  }
  .bubble.bot code { font-family: Consolas, monospace; }
  .bubble.bot :not(pre) > code { background: var(--deep); padding: 1px 5px; border-radius: 4px; }
  .hint {
    color: var(--muted); font-size: 13px; background: var(--panel);
    border: 1px dashed var(--panel-border); padding: 14px; border-radius: 10px;
    max-width: 78%;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 6px; }
  .chips button {
    background: var(--deep); color: #A5B4FC; border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 6px 12px; font-size: 11px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--accent); color: #fff; }
  footer { display: flex; gap: 10px; padding: 14px 20px 18px; }
  #input {
    flex: 1; background: var(--deep); color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 12px; font-size: 14px; resize: none; height: 64px;
    font-family: inherit;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  #send {
    width: 84px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: bold;
  }
  #send:hover { background: var(--accent-hover); }
  #send:disabled { background: #334155; color: var(--muted); cursor: default; }
  #status { padding: 0 22px 10px; font-size: 11px; color: var(--faint); min-height: 16px; }
</style>
</head>
<body>
<header>
  <div>
    <h1><img src="/favicon.png" alt="logo"> Study Buddy</h1>
    <div class="sub" id="model-line">GPT-OSS via Groq</div>
  </div>
  <button id="reset">New chat</button>
</header>

<div id="chat">
  <div class="row"><div class="hint">Ask me anything about your studies — explanations, exam plans, or a quick quiz. I'll keep it short and step-by-step.</div></div>
</div>

<div class="chips" id="chips">
  <button data-p="Explain photosynthesis like I'm 10">Explain photosynthesis like I'm 10</button>
  <button data-p="Make a 7-day study plan for my exams">Make a 7-day study plan</button>
  <button data-p="Quiz me on quadratic equations">Quiz me on quadratics</button>
</div>

<footer>
  <textarea id="input" placeholder="Ask anything about your studies…  (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="send">Send</button>
</footer>
<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const chatEl = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
const chips = document.getElementById("chips");
const history = [];  // [{role, content}] — kept in the browser, nothing stored server-side
let busy = false;

const md = (text) => {
  try { return marked.parse(text, { breaks: true }); }
  catch { const p = document.createElement("div"); p.textContent = text; return p.innerHTML; }
};

const scrollDown = () => { chatEl.scrollTop = chatEl.scrollHeight; };

function addBubble(role, html, isError = false) {
  const row = document.createElement("div");
  row.className = "row" + (role === "user" ? " user" : "");
  const bubble = document.createElement("div");
  bubble.className = "bubble " + (role === "user" ? "user" : "bot" + (isError ? " error" : ""));
  bubble.innerHTML = html;
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollDown();
  return bubble;
}

function setBusy(state) {
  busy = state;
  sendBtn.disabled = state;
  sendBtn.textContent = state ? "…" : "Send";
  statusEl.textContent = state ? "Study Buddy is thinking…" : "";
}

async function send() {
  const message = input.value.trim();
  if (!message || busy) return;
  input.value = "";
  chips.style.display = "none";
  addBubble("user", md(message));
  history.push({ role: "user", content: message });
  const bubble = addBubble("bot", "<em>…</em>");
  setBusy(true);

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, history: history.slice(0, -1) }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed (" + res.status + ")");
    bubble.innerHTML = md(data.reply);
    history.push({ role: "assistant", content: data.reply });
  } catch (err) {
    bubble.classList.add("error");
    bubble.textContent = "⚠️ " + err.message;
    history.pop();  // drop the unanswered question
  } finally {
    setBusy(false);
    input.focus();
    scrollDown();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("reset").addEventListener("click", () => {
  if (busy) return;
  history.length = 0;
  chatEl.innerHTML = '<div class="row"><div class="hint">Ask me anything about your studies — explanations, exam plans, or a quick quiz. I\'ll keep it short and step-by-step.</div></div>';
  chips.style.display = "flex";
});
chips.querySelectorAll("button").forEach((b) =>
  b.addEventListener("click", () => { input.value = b.dataset.p; input.focus(); })
);

fetch("/api/health").then(r => r.json()).then((h) => {
  if (h.model) document.getElementById("model-line").textContent = "GPT-OSS via Groq · " + h.model;
  if (h.status !== "ok") statusEl.textContent = h.detail || "Service not ready.";
}).catch(() => {});
input.focus();
</script>
</body>
</html>
